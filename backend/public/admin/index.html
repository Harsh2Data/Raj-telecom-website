<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Raj Telecom</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-mark">RT</span>
        <span class="brand-name">Raj Telecom</span>
      </div>
      <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Close menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="sidebar-utility-row">
      <div class="conn-status" id="connStatus"><span class="dot"></span><span class="conn-label">Connecting…</span></div>
      <div class="notif-wrap">
        <button type="button" class="notif-bell" id="notifBellBtn" title="Notifications" aria-label="Notifications">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="notif-badge" id="notifBadge" hidden>0</span>
        </button>
        <div class="notif-panel" id="notifPanel">
          <div class="notif-panel-head">
            <h4>Notifications</h4>
            <button type="button" id="notifMarkAllBtn">Mark all read</button>
          </div>
          <div class="notif-list" id="notifList"></div>
        </div>
      </div>
    </div>

    <nav class="side-nav">
      <button type="button" class="nav-item active" data-view="dashboard">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </button>
      <button type="button" class="nav-item" data-view="conversations">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Conversations
        <span class="nav-badge" id="navUnreadBadge" hidden>0</span>
      </button>
      <button type="button" class="nav-item" data-view="settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
    </nav>

    <div class="sidebar-bottom">
      <div class="admin-card">
        <span class="admin-avatar" id="adminAvatar">A</span>
        <div class="admin-info">
          <div class="admin-name" id="adminName">—</div>
          <div class="admin-email" id="adminEmail">—</div>
        </div>
      </div>
      <button type="button" class="logout-btn" id="logoutBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button type="button" class="hamburger" id="hamburgerBtn" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <button type="button" class="mute-btn" id="muteBtn" title="Mute notifications"></button>
    </header>

    <main class="main">
      <!-- DASHBOARD -->
      <section class="view active" id="view-dashboard">
        <div class="view-header">
          <h1 id="greeting">Welcome back</h1>
          <p class="view-sub" id="todayDate"></p>
        </div>
        <div class="stat-grid" id="statGrid">
          <button type="button" class="stat-card stat-unread skel" data-goto-filter="unread">
            <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
            <div class="num" id="statUnread">–</div>
            <div class="label">New / unread</div>
          </button>
          <button type="button" class="stat-card stat-active skel" data-goto-filter="open">
            <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
            <div class="num" id="statActive">–</div>
            <div class="label">Active conversations</div>
          </button>
          <button type="button" class="stat-card stat-expiring skel" data-goto-filter="expiring">
            <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/><path d="m4.9 4.9 1.4 1.4M19.1 4.9l-1.4 1.4"/></svg></div>
            <div class="num" id="statExpiring">–</div>
            <div class="label">Expiring soon</div>
          </button>
          <button type="button" class="stat-card stat-closed skel" data-goto-filter="closed">
            <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="num" id="statClosed">–</div>
            <div class="label">Closed</div>
          </button>
          <div class="stat-card stat-total skel">
            <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
            <div class="num" id="statTotal">–</div>
            <div class="label">Total conversations</div>
          </div>
          <div class="stat-card stat-today skel">
            <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
            <div class="num" id="statToday">–</div>
            <div class="label">Today</div>
          </div>
        </div>
      </section>

      <!-- CONVERSATIONS -->
      <section class="view conv-view" id="view-conversations">
        <div class="conv-list-pane" id="convListPane">
          <div class="conv-list-head">
            <div class="search-row">
              <div class="search-box">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="search" id="convSearch" placeholder="Search name, phone, model…">
              </div>
            </div>
            <select class="filter-select" id="convFilterSelect">
              <option value="all">All conversations</option>
              <option value="unread">Unread</option>
              <option value="open">Open</option>
              <option value="closed">Closed</option>
              <option value="expiring">Expiring soon</option>
              <optgroup label="Repair stage">
                <option value="stage:new_lead">New lead</option>
                <option value="stage:inspection">Inspection</option>
                <option value="stage:estimate_sent">Estimate sent</option>
                <option value="stage:repair_approved">Repair approved</option>
                <option value="stage:repair_in_progress">Repair in progress</option>
                <option value="stage:ready_for_pickup">Ready for pickup</option>
                <option value="stage:completed">Completed</option>
              </optgroup>
            </select>
          </div>
          <div class="conv-list" id="convList"></div>
        </div>

        <div class="chat-pane" id="chatPane">
          <div class="chat-placeholder" id="chatPlaceholder">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <p>Select a conversation to start replying</p>
          </div>
        </div>
      </section>

      <!-- SETTINGS -->
      <section class="view" id="view-settings">
        <div class="view-header">
          <h1>Settings</h1>
          <p class="view-sub">Manage your account and who has access to the admin panel.</p>
        </div>
        <div class="settings-grid">
          <div class="settings-card">
            <h3>Your profile</h3>
            <div class="field"><label for="profileName">Name</label><input type="text" id="profileName"></div>
            <div class="field"><label for="profileEmail">Email</label><input type="email" id="profileEmail" disabled></div>
            <button type="button" class="btn btn-primary btn-sm btn-block" id="saveProfileBtn">Save name</button>
            <p class="settings-msg" id="profileMsg"></p>

            <hr class="settings-divider">

            <h3>Change password</h3>
            <div class="field"><label for="curPassword">Current password</label><input type="password" id="curPassword" autocomplete="current-password"></div>
            <div class="field"><label for="newPassword">New password</label><input type="password" id="newPassword" autocomplete="new-password"></div>
            <div class="field"><label for="confirmPassword">Confirm new password</label><input type="password" id="confirmPassword" autocomplete="new-password"></div>
            <button type="button" class="btn btn-primary btn-sm btn-block" id="savePasswordBtn">Update password</button>
            <p class="settings-msg" id="passwordMsg"></p>
          </div>

          <div class="settings-card">
            <h3>Admin team</h3>
            <div class="admin-team-list" id="adminTeamList"></div>

            <hr class="settings-divider">

            <h4>Add a new admin</h4>
            <div class="field"><label for="newAdminName">Name</label><input type="text" id="newAdminName" placeholder="e.g. Store staff"></div>
            <div class="field"><label for="newAdminEmail">Email</label><input type="email" id="newAdminEmail"></div>
            <div class="field"><label for="newAdminPassword">Temporary password</label><input type="password" id="newAdminPassword" placeholder="At least 8 characters"></div>
            <button type="button" class="btn btn-primary btn-sm btn-block" id="addAdminBtn">Add admin</button>
            <p class="settings-msg" id="addAdminMsg"></p>
          </div>

          <div class="settings-card">
            <h3>WhatsApp connection</h3>
            <div class="wa-status-list" id="waStatusList">
              <div class="skel-line w60"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
