<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Raj Telecom</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <h1>Raj Telecom Admin</h1>
    <p class="sub">Sign in to manage customer conversations.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="loginError"></p>
      <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>
    </form>
  </div>
</div>
<script src="js/api.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      await AdminAPI.login(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );
      window.location.href = 'index.html';
    } catch (error) {
      errorEl.textContent = error.message;
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });

  // Already logged in? Skip straight to the app.
  AdminAPI.me().then(() => { window.location.href = 'index.html'; }).catch(() => {});
</script>
</body>
</html>
